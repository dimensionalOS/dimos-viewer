# Build & publish dimos-viewer wheels.
#
# Closely follows Rerun's reusable_build_and_upload_wheels.yml pattern:
#   - manylinux_2_28 Docker container for Linux builds
#   - Same system deps as Rerun's ci_docker Dockerfile
#   - Same Rust toolchain (from rust-toolchain file)
#   - Same shell defaults and env conventions
#   - GitHub Artifacts instead of GCS for wheel storage
#   - Trusted publisher (OIDC) for PyPI instead of API token
#
# Wheel layout:
#   `dimos-viewer` is a plain binary that links no Python (`cargo tree -p dimos-viewer -i pyo3`
#   finds nothing), so one `py3-none-<platform>` wheel per platform serves every supported
#   CPython version. The wheel is built once per platform and then install-tested on every
#   Python version listed in the `test-wheel` matrix (keep that list and the
#   `Programming Language :: Python :: 3.x` classifiers in `dimos/pyproject.toml` in sync).
#
# Triggers:
#   PR → main          build + test
#   push → main        build + test
#   tag v*             build + test + publish to PyPI + GitHub Release

name: Build & Publish dimos-viewer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  # Interpreter used to drive `maturin build`. It does not affect the wheel contents: the binary
  # links no Python, and the wheel is retagged to `py3-none` after the build (see below).
  BUILD_PYTHON_VERSION: "3.14"
  BUILD_PYTHON_TAG: cp312-cp312
  PACKAGE_DIR: dimos

# ---------------------------------------------------------------------------
jobs:

  # -------------------------------------------------------------------
  # 1. Rust checks & tests (native Ubuntu, no container needed)
  # -------------------------------------------------------------------
  check:
    name: Cargo check & test
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup install
          rustup show active-toolchain

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libvulkan-dev \
            mesa-vulkan-drivers libxkbcommon-x11-0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo check -p dimos-viewer
      - run: cargo test  -p dimos-viewer

  # -------------------------------------------------------------------
  # 2. Build one universal (py3-none) wheel per platform
  #    Linux: manylinux_2_28 container with Rerun's exact deps
  #    macOS: native runner
  # -------------------------------------------------------------------
  build-wheel:
    name: Build wheel (${{ matrix.platform }})
    needs: [check]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
            compatibility: manylinux_2_28
          - platform: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
            compatibility: manylinux_2_28
          - platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            container: ""
            compatibility: ""

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}

    steps:
      - uses: actions/checkout@v4

      # --- Linux (inside manylinux_2_28 container) ---
      # Replicates Rerun's ci_docker/Dockerfile setup inline
      - name: Install system dependencies (manylinux)
        if: matrix.container != ''
        run: |
          dnf install -y \
            make automake gcc gcc-c++ kernel-devel \
            cmake \
            curl \
            git \
            atk at-spi2-atk \
            fontconfig-devel \
            freetype-devel \
            glib2-devel \
            gtk3-devel \
            openssl-devel \
            xcb-util-renderutil-devel \
            xcb-util-devel \
            xcb-util-wm-devel \
            libxkbcommon-devel \
            python3-pip
          dnf clean all

      - name: Install Rust (manylinux)
        if: matrix.container != ''
        env:
          RUSTUP_HOME: /usr/local/rustup
          CARGO_HOME: /usr/local/cargo
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "/usr/local/cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust toolchain (manylinux)
        if: matrix.container != ''
        run: |
          rustup install
          rustup show active-toolchain

      - name: Install maturin (manylinux)
        if: matrix.container != ''
        run: |
          /opt/python/${{ env.BUILD_PYTHON_TAG }}/bin/python3 -m pip install --upgrade pip
          /opt/python/${{ env.BUILD_PYTHON_TAG }}/bin/python3 -m pip install "maturin>=1.8.1" wheel
          echo "/opt/python/${{ env.BUILD_PYTHON_TAG }}/bin" >> "$GITHUB_PATH"

      - name: Build wheel (manylinux)
        if: matrix.container != ''
        run: |
          maturin build \
            --release \
            --manifest-path "${{ env.PACKAGE_DIR }}/Cargo.toml" \
            --target "${{ matrix.target }}" \
            --compatibility "${{ matrix.compatibility }}" \
            --out dist/

      # --- macOS (native runner) ---
      - name: Install Rust (macOS)
        if: matrix.container == ''
        run: |
          rustup install
          rustup show active-toolchain

      - name: Set up Python (macOS)
        if: matrix.container == ''
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.BUILD_PYTHON_VERSION }}"

      - name: Install maturin (macOS)
        if: matrix.container == ''
        run: |
          python3 -m pip install "maturin>=1.8.1" wheel

      - name: Build wheel (macOS)
        if: matrix.container == ''
        run: |
          maturin build \
            --release \
            --manifest-path "${{ env.PACKAGE_DIR }}/Cargo.toml" \
            --target "${{ matrix.target }}" \
            --out dist/

      # --- Common ---
      - name: Retag wheel as py3-none
        run: |
          # maturin tags the wheel `cpXY-cpXY` for the interpreter it was built with, because
          # `cargo metadata` unifies features across the whole workspace: `rerun_py` enables
          # `re_protos/py`, which makes `pyo3` look like an indirect dependency of `dimos-viewer`
          # even though the binary never links it. The wheel contents are identical for every
          # interpreter, so retag it to the universal `py3-none` tag.
          python3 -m wheel tags --python-tag py3 --abi-tag none --remove dist/*.whl
          ls -la dist/
          for whl in dist/*.whl; do
            case "$(basename "$whl")" in
              *-py3-none-*.whl) ;;
              *) echo "::error::Unexpected wheel tag: $whl"; exit 1 ;;
            esac
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl

  # -------------------------------------------------------------------
  # 3. Install-test the Linux wheels on every supported Python (x64 + arm64)
  # -------------------------------------------------------------------
  test-wheel:
    name: Test wheel (${{ matrix.arch }}-py${{ matrix.python-version }})
    needs: [build-wheel]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        arch: [x64, arm64]
        include:
          - arch: x64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: dist/

      - name: Install wheel
        run: pip install dist/*.whl

      - name: Verify binary
        run: |
          which dimos-viewer
          dimos-viewer --help

  # -------------------------------------------------------------------
  # 4. Publish to PyPI (tag v* only)
  #    Uses trusted publisher (OIDC) — no API token needed.
  # -------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: [test-wheel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - run: ls -la dist/

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  # -------------------------------------------------------------------
  # 5. GitHub Release (tag v* only)
  # -------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: [publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
