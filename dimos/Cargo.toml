[package]
name = "dimos-viewer"
version = "0.32.0-alpha.1"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false
description = "DimOS Interactive Viewer — custom Rerun viewer with LCM click-to-navigate"

[[bin]]
name = "dimos-viewer"
path = "src/viewer.rs"

[lib]
name = "dimos_viewer"
path = "src/lib.rs"

[features]
default = []
analytics = ["rerun/analytics"]

[dependencies]
re_dimos.workspace = true
rerun = { path = "../crates/top/rerun", default-features = false, features = [
  "native_viewer",
  "run",
  "server",
] }

clap.workspace = true
mimalloc.workspace = true

[lints]
workspace = true
